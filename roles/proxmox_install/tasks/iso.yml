# Uses the Proxmox VE installer ISO on the host as the only package source (air-gapped, no mirror).
# The ISO holds two unsigned apt repositories that together cover Proxmox VE and the Debian packages
# it needs: dists/trixie/pve (Debian base) and proxmox/packages (everything else).
- name: "Mount the Proxmox VE ISO"
  include_tasks: iso_file.yml
  vars:
    proxmox_install_isofile_name: Proxmox VE ISO
    proxmox_install_isofile_src: "{{ proxmox_install_iso_path }}"
    proxmox_install_isofile_store: "{{ proxmox_install_iso_store }}"
    proxmox_install_isofile_mount: "{{ proxmox_install_iso_mount }}"

- name: "Check that the ISO is a Proxmox VE 9 installer"
  command: grep -q "RELEASE='9" {{ proxmox_install_iso_mount | quote }}/.cd-info
  changed_when: false

# Optional: the Debian 13 DVD as a second package source, for Debian packages that aren't on the
# Proxmox ISO (e.g. auditd, sudo). Its repository is signed by Debian.
- name: "Mount the Debian DVD"
  when: proxmox_install_debian_iso_path | length > 0
  block:
    - name: "Mount the Debian DVD"
      include_tasks: iso_file.yml
      vars:
        proxmox_install_isofile_name: Debian DVD
        proxmox_install_isofile_src: "{{ proxmox_install_debian_iso_path }}"
        proxmox_install_isofile_store: "{{ proxmox_install_debian_iso_store }}"
        proxmox_install_isofile_mount: "{{ proxmox_install_debian_iso_mount }}"
    - name: "Check that the ISO is a Debian 13 DVD"
      command: grep -q "Debian GNU/Linux 13" {{ proxmox_install_debian_iso_mount | quote }}/.disk/info
      changed_when: false

# The ISO's repositories are unsigned ("Trusted: yes"). Pinning them above everything else makes apt
# use the ISO's versions, so the ISO's packages always fit together: some depend on exact versions
# (e.g. perl on perl-base) and can't be satisfied by newer Debian packages already on the host.
# The Debian DVD, also a local repository, is pinned first at the normal priority: apt uses the first
# matching pin, so the DVD only provides packages (and versions) the Proxmox ISO doesn't win.
- name: "Add the ISO repositories"
  copy:
    content: |
      Types: deb
      URIs: file:{{ proxmox_install_iso_mount }}
      Suites: trixie
      Components: pve
      Trusted: yes

      Types: deb
      URIs: file:{{ proxmox_install_iso_mount }}/proxmox/packages
      Suites: ./
      Trusted: yes
      {% if proxmox_install_debian_iso_path | length > 0 %}

      Types: deb
      URIs: file:{{ proxmox_install_debian_iso_mount }}
      Suites: trixie
      Components: main non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      {% endif %}
    dest: /etc/apt/sources.list.d/pve-iso.sources
    mode: "0644"
- name: "Prefer the ISO's package versions"
  copy:
    content: |
      {% if proxmox_install_debian_iso_path | length > 0 %}
      # The Debian DVD: normal priority (first matching pin wins).
      Package: *
      Pin: release o=Debian
      Pin-Priority: 500

      {% endif %}
      # Local (file:) repositories, i.e. the Proxmox VE ISO, win over everything else.
      Package: *
      Pin: origin ""
      Pin-Priority: 1001
    dest: /etc/apt/preferences.d/pve-iso.pref
    mode: "0644"

# Air-gapped, the installer's sources (internet mirrors, the Debian DVD) can't be reached and make
# "apt update" fail. Backups are kept next to the files.
- name: "Disable the other apt sources"
  when: proxmox_install_iso_disable_other_sources
  block:
    - name: "Find the other apt sources"
      find:
        paths: /etc/apt/sources.list.d
        patterns: "*.sources,*.list"
        excludes: pve-iso.sources
      register: proxmox_install_other_sources
    - name: "Back up sources.list"
      copy:
        src: /etc/apt/sources.list
        dest: /etc/apt/sources.list.pre-pve-iso
        remote_src: true
        force: false
        mode: "0644"
      failed_when: false
    - name: "Empty sources.list"
      copy:
        content: "# Disabled: packages come from the ISOs (/etc/apt/sources.list.d/pve-iso.sources).\n"
        dest: /etc/apt/sources.list
        mode: "0644"
    - name: "Disable the other deb822 sources"
      lineinfile:
        path: "{{ item.path }}"
        regexp: '^Enabled:'
        line: "Enabled: no"
        insertafter: '^Types:'
      loop: "{{ proxmox_install_other_sources.files | selectattr('path', 'match', '.*\\.sources$') | list }}"
      loop_control:
        label: "{{ item.path }}"
    - name: "Disable the other one-line sources"
      command: mv {{ item.path | quote }} {{ (item.path ~ '.disabled') | quote }}
      args:
        removes: "{{ item.path }}"
      loop: "{{ proxmox_install_other_sources.files | selectattr('path', 'match', '.*\\.list$') | list }}"
      loop_control:
        label: "{{ item.path }}"

# python3-apt (for Ansible's apt module) comes from the ISO; installed with apt-get so that a
# version change forced by the pin is allowed.
- name: "Install python3-apt from the ISO"
  shell: |
    set -e
    apt-get update -q
    if python3 -c 'import apt' 2>/dev/null; then exit 0; fi
    DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades python3-apt
    echo installed
  register: proxmox_install_python_apt
  changed_when: "'installed' in proxmox_install_python_apt.stdout"
