- name: "Install Proxmox VE"
  include_tasks: install.yml

- name: "Check CIS mounts"
  include_tasks: mounts.yml
  when: proxmox_install_required_mounts | length > 0

- name: "Setup auditd"
  include_tasks: auditd.yml
  when: proxmox_install_auditd_enabled

- name: "Setup networking"
  include_tasks: network.yml
  when: proxmox_install_network_interfaces | length > 0

- name: "Setup storage"
  include_tasks: storage.yml
  when: proxmox_install_storage_cfg | length > 0
