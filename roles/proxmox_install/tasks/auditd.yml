# auditd isn't on the Proxmox VE ISO: with only the ISO, bring its .deb files in through
# proxmox_install_local_debs_dir.
- name: "Install auditd"
  block:
    - name: "Install auditd"
      apt:
        name:
          - auditd
          - audispd-plugins
        state: present
  rescue:
    - name: "Explain how to get auditd"
      fail:
        msg: >-
          auditd could not be installed: {{ ansible_failed_result.msg | default('') }}.
          It isn't on the Proxmox VE ISO. Add the Debian 13 DVD as package source
          (proxmox_install_debian_iso_path), or put its .deb files (auditd, audispd-plugins,
          libauparse0t64) in a directory on the controller and set proxmox_install_local_debs_dir,
          or set proxmox_install_auditd_enabled to false.

- name: "Enable auditd"
  systemd_service:
    name: auditd.service
    state: started
    enabled: true
