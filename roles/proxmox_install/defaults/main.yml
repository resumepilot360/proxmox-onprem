# Proxmox VE installer ISO on the host (e.g. /tmp/proxmox-ve_9.2-1.iso), used as the only package
# source: no mirror or internet needed. Empty: use the repositories below.
proxmox_install_iso_path: ""
# Where the ISO is moved to (/tmp is emptied by the reboot) and mounted. Needs ~2 GB free.
proxmox_install_iso_store: /var/lib/proxmox-iso/proxmox-ve.iso
proxmox_install_iso_mount: /mnt/pve-iso
# Optional: the Debian 13 DVD ISO on the host (e.g. /tmp/debian-13.7.0-amd64-DVD-1.iso), used as a
# second package source for Debian packages that aren't on the Proxmox ISO (auditd, sudo, ...).
# Needs ~4 GB in the directory of proxmox_install_debian_iso_store. Empty: not used.
proxmox_install_debian_iso_path: ""
proxmox_install_debian_iso_store: /var/lib/proxmox-iso/debian-dvd.iso
proxmox_install_debian_iso_mount: /mnt/debian-iso
# Disable the host's other apt sources (internet mirrors, the Debian DVD), which air-gapped can't be
# reached and make "apt update" fail. Backups are kept.
proxmox_install_iso_disable_other_sources: true

# Directory on the controller with extra .deb files that aren't on the ISO (e.g. auditd), installed
# before Proxmox VE. Empty: none.
proxmox_install_local_debs_dir: ""

# Debian repositories as deb822 content, e.g. a local mirror. Empty: keep the host's sources.
proxmox_install_debian_sources: ""

# Proxmox VE repository (a local mirror when air-gapped).
proxmox_install_pve_repo_url: "http://download.proxmox.com/debian/pve"
proxmox_install_pve_repo_component: pve-no-subscription

# Proxmox archive keyring: a file on the controller (air-gapped), otherwise downloaded from the URL.
proxmox_install_keyring_src: ""
proxmox_install_keyring_url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg"

# The enterprise repositories need a subscription and internet access.
proxmox_install_disable_enterprise_repo: true

# /etc/hosts entry for the node: Proxmox needs the hostname to resolve to this IP.
proxmox_install_node_ip: "{{ ansible_facts.default_ipv4.address }}"
proxmox_install_domain: "{{ ansible_facts.domain | default('localdomain', true) }}"

# Mount points that must exist with at least these options (checked live and in /etc/fstab).
# Empty: no check.
proxmox_install_required_mounts: {}

# Install and enable auditd (audit rules are not managed).
proxmox_install_auditd_enabled: false

# Full content of /etc/network/interfaces, e.g. with a vmbr0 bridge for guests. Empty: not managed.
proxmox_install_network_interfaces: ""

# Full content of /etc/pve/storage.cfg. Empty: not managed (Proxmox default: "local" in /var/lib/vz).
proxmox_install_storage_cfg: ""
