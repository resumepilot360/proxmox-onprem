# VMs to create on the Proxmox server, one dict each. Required: vmid, name, address (CIDR), gateway.
# Any key of proxmox_vm_defaults can be overridden per VM.
proxmox_vm_guests: []
#  - vmid: 201
#    name: pve-a
#    address: 192.168.10.31/24
#    gateway: 192.168.10.1

proxmox_vm_defaults:
  memory: 8192             # MiB
  cores: 4
  disk_storage: local-lvm  # Proxmox storage for the VM disk
  disk_size: 100           # GiB; CIS partitions below, the rest becomes the "data" thin pool
  bridge: vmbr0
  vlan: ""                 # VLAN tag on the bridge; empty: none
  nameservers: ""          # space separated; empty: none (air-gapped)
  domain: localdomain

# ISOs on the Proxmox server, as storage volumes (see "pvesm list local").
# The Debian DVD (not netinst) installs without a mirror; the Proxmox ISO is the package source after.
proxmox_vm_debian_iso: local:iso/debian-13.7.0-amd64-DVD-1.iso
proxmox_vm_pve_iso: local:iso/proxmox-ve_9.2-1.iso

# Root password of the new nodes as a crypt hash (also the Proxmox web UI login), e.g. from
# "openssl passwd -6". Keep it in a vault.
proxmox_vm_root_password_hash: ""
# SSH key Ansible logs in to the new nodes with, as root.
proxmox_vm_ssh_public_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

proxmox_vm_timezone: UTC
proxmox_vm_keymap: us

# Seconds to wait for the unattended Debian install of one VM.
proxmox_vm_install_timeout: 3600

# CIS partition sizes in GiB, as LVs in volume group "pve". /boot (1 GiB) is a plain partition.
proxmox_vm_partitions:
  root: 20
  swap: 4
  home: 2
  tmp: 4
  var: 20
  var_tmp: 4
  var_log: 8
  var_log_audit: 4

# Working files on the Proxmox server (installer kernel, initrd with the preseed file), per VM.
proxmox_vm_workdir: /var/lib/vz/proxmox-vm-install
