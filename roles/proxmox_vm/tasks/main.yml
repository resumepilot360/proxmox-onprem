# Runs on the Proxmox server: creates the VMs and installs Debian 13 in them unattended, then adds
# them to the inventory (groups "proxmox" and "proxmox_vm_new") for the proxmox_install role.
- name: "Check the settings"
  assert:
    that:
      - proxmox_vm_guests | length > 0
      - proxmox_vm_root_password_hash is match('^\$')
      - proxmox_vm_guests | rejectattr('vmid', 'defined') | list | length == 0
      - proxmox_vm_guests | rejectattr('name', 'defined') | list | length == 0
      - proxmox_vm_guests | rejectattr('address', 'defined') | list | length == 0
      - proxmox_vm_guests | rejectattr('gateway', 'defined') | list | length == 0
      - proxmox_vm_guests | map(attribute='address') | reject('search', '/') | list | length == 0
    fail_msg: >-
      Set proxmox_vm_guests (each with vmid, name, address as CIDR, gateway) and
      proxmox_vm_root_password_hash (a crypt hash, e.g. from "openssl passwd -6").
    quiet: true

- name: "Find the ISOs"
  command: pvesm path {{ item | quote }}
  loop:
    - "{{ proxmox_vm_debian_iso }}"
    - "{{ proxmox_vm_pve_iso }}"
  register: proxmox_vm_iso_paths
  changed_when: false

- name: "Check that the ISOs exist"
  stat:
    path: "{{ item.stdout }}"
    get_checksum: false
  loop: "{{ proxmox_vm_iso_paths.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: proxmox_vm_iso_stat
  failed_when: not proxmox_vm_iso_stat.stat.exists

# All VMs install in parallel: create and start them all, then wait for each.
- name: "Create the VMs"
  include_tasks: create.yml
  loop: "{{ proxmox_vm_guests }}"
  loop_control:
    loop_var: proxmox_vm_guest
    label: "{{ proxmox_vm_guest.name }}"

- name: "Wait for the installs"
  include_tasks: finish.yml
  loop: "{{ proxmox_vm_guests }}"
  loop_control:
    loop_var: proxmox_vm_guest
    label: "{{ proxmox_vm_guest.name }}"

- name: "Add the VMs to the inventory"
  add_host:
    name: "{{ item.name }}"
    groups:
      - proxmox
      - proxmox_vm_new
    ansible_host: "{{ item.address.split('/')[0] }}"
    ansible_user: root
    ansible_become: false
    # The node's host key is new; a VM recreated at the same IP needs its old key removed first.
    ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
    proxmox_vm_address: "{{ item.address }}"
    proxmox_vm_gateway: "{{ item.gateway }}"
  loop: "{{ proxmox_vm_guests }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
