# Creates one VM that boots the Debian installer kernel directly, with the preseed file in its initrd.
# Skipped when the VM already exists.
- name: "Settings for {{ proxmox_vm_guest.name }}"
  set_fact:
    proxmox_vm: "{{ proxmox_vm_defaults | combine(proxmox_vm_guest) }}"
    proxmox_vm_dir: "{{ proxmox_vm_workdir }}/{{ proxmox_vm_guest.vmid }}"

- name: "Check whether VM {{ proxmox_vm.vmid }} exists"
  command: qm status {{ proxmox_vm.vmid }}
  register: proxmox_vm_status
  changed_when: false
  failed_when: false

- name: "Create and start VM {{ proxmox_vm.vmid }}"
  when: proxmox_vm_status.rc != 0
  block:
    - name: "Create the working directory"
      file:
        path: "{{ proxmox_vm_dir }}"
        state: directory
        mode: "0700"

    - name: "Copy the installer kernel and initrd from the Debian ISO"
      shell: |
        set -e
        m=$(mktemp -d)
        mount -o loop,ro {{ proxmox_vm_iso_paths.results[0].stdout | quote }} "$m"
        trap 'umount "$m"; rmdir "$m"' EXIT
        cp "$m/install.amd/vmlinuz" "$m/install.amd/initrd.gz" {{ proxmox_vm_dir | quote }}/
      args:
        creates: "{{ proxmox_vm_dir }}/vmlinuz"

    - name: "Write the preseed file"
      template:
        src: preseed.cfg.j2
        dest: "{{ proxmox_vm_dir }}/preseed.cfg"
        mode: "0600"

    # The kernel unpacks concatenated cpio archives, so the preseed file can be appended to the initrd.
    - name: "Add the preseed file to the initrd"
      shell: |
        set -eo pipefail
        cd {{ proxmox_vm_dir | quote }}
        cp initrd.gz initrd-preseed.gz
        echo preseed.cfg | cpio -H newc -o --quiet | gzip >> initrd-preseed.gz
      args:
        executable: /bin/bash
        creates: "{{ proxmox_vm_dir }}/initrd-preseed.gz"

    - name: "Create VM {{ proxmox_vm.vmid }}"
      command:
        argv:
          - qm
          - create
          - "{{ proxmox_vm.vmid }}"
          - --name
          - "{{ proxmox_vm.name }}"
          - --ostype
          - l26
          - --machine
          - q35
          # "host" passes the CPU's virtualization extensions through, for VMs inside the node.
          - --cpu
          - host
          - --cores
          - "{{ proxmox_vm.cores }}"
          - --memory
          - "{{ proxmox_vm.memory }}"
          - --scsihw
          - virtio-scsi-single
          - --scsi0
          - "{{ proxmox_vm.disk_storage }}:{{ proxmox_vm.disk_size }},iothread=1,discard=on"
          - --net0
          - "virtio,bridge={{ proxmox_vm.bridge }}{{ (',tag=' ~ proxmox_vm.vlan) if proxmox_vm.vlan | string | length > 0 else '' }}"
          - --ide2
          - "{{ proxmox_vm_debian_iso }},media=cdrom"
          - --boot
          - order=scsi0;ide2
          - --args
          - "-kernel {{ proxmox_vm_dir }}/vmlinuz -initrd {{ proxmox_vm_dir }}/initrd-preseed.gz -append 'auto=true priority=critical ---'"

    - name: "Start VM {{ proxmox_vm.vmid }}"
      command: qm start {{ proxmox_vm.vmid }}
