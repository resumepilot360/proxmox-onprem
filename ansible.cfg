[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
# Keepalives so a connection killed by a reboot fails fast instead of hanging forever.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
