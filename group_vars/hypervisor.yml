# The Proxmox server that hosts the new nodes, and the VMs to create on it (playbook vm.yml).

# Both ISOs must be on the server, e.g. in storage "local" (/var/lib/vz/template/iso/).
# Use the Debian DVD (debian-13.x.y-amd64-DVD-1.iso), not netinst: it installs without a mirror.
proxmox_autoinstall_debian_iso: local:iso/debian-13.7.0-amd64-DVD-1.iso
proxmox_autoinstall_pve_iso: local:iso/proxmox-ve_9.2-1.iso

# Root password of the new nodes (also the web UI login) as a hash: openssl passwd -6
# Better in a vault: ansible-vault encrypt_string '<hash>' --name proxmox_autoinstall_root_password_hash
proxmox_autoinstall_root_password_hash: ""

proxmox_autoinstall_nodes:
  - vmid: 201
    name: pve-vm1
    address: 192.168.10.31/24
    gateway: 192.168.10.1
    # memory: 16384
    # disk_size: 200

# Defaults for every VM; override per VM above (a dict here replaces all of them).
